<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 70%;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My Web App</h1>
    <p>Enter your name:</p>

    <input type="text" id="name" placeholder="Your name">
    <br>

    <button onclick="sayHello()">Submit</button>

    <div id="message"></div>
</div>

<script>
    function sayHello() {
        let name = document.getElementById("name").value;

        if (name === "") {
            document.getElementById("message").innerText =
                "Please enter your name.";
        } else {
            document.getElementById("message").innerText =
                "Hello, " + name + "!";
        }
    }
</script>

</body>
</html>
